<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ベクトル書きこみワーク</title>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: one narrow column (max 560px). Lesson = stack of sections; each item is a card with its own feedback line. */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#15262a; --muted:#5c7276; --line:#d3e0e1;
  --teal:#0f6e78; --teal-soft:#e2f1f2; --orange:#c0571b; --orange-soft:#fbeee6;
  --ok:#1f7a45; --ok-soft:#e3f3e9; --grid:#d5dfe0; --given:#3b5b62;
  --t1:#0f6e78; --t2:#2f8a55; --t3:#c0571b; --t4:#6a4c9c; --t5:#5d6668;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-math:"STIX Two Text","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172326; --ink:#e4eef0; --muted:#93a9ad; --line:#2a3b3f;
  --teal:#4fb7c2; --teal-soft:#16353a; --orange:#f08a4b; --orange-soft:#3a2418;
  --ok:#5fcf8a; --ok-soft:#173326; --grid:#2c3d41; --given:#9fc0c6;
  --t1:#2f9aa5; --t2:#3f9c66; --t3:#d06a2d; --t4:#8466b8; --t5:#6f7a7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172326; --ink:#e4eef0; --muted:#93a9ad; --line:#2a3b3f;
  --teal:#4fb7c2; --teal-soft:#16353a; --orange:#f08a4b; --orange-soft:#3a2418;
  --ok:#5fcf8a; --ok-soft:#173326; --grid:#2c3d41; --given:#9fc0c6;
  --t1:#2f9aa5; --t2:#3f9c66; --t3:#d06a2d; --t4:#8466b8; --t5:#6f7a7c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 80px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
i,.m{font-family:var(--f-math);font-style:italic;font-size:1.08em}
.up{font-family:var(--f-math);font-style:normal;font-size:1.08em}
.v{position:relative;display:inline-block;padding-top:.36em;line-height:1;font-family:var(--f-math);font-style:italic;font-size:1.08em;white-space:nowrap}
.v::before{content:"";position:absolute;left:.06em;right:.12em;top:.2em;border-top:.07em solid currentColor}
.v::after{content:"";position:absolute;right:-.02em;top:.1em;border-left:.28em solid currentColor;border-top:.13em solid transparent;border-bottom:.13em solid transparent}
.v.z{font-style:normal}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar .back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.bar .ttl{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sc{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}

/* home */
.hero{padding:18px 0 8px}
.hero .eb{font-size:13px;letter-spacing:.12em;color:var(--teal);font-weight:700}
.hero h1{font-size:34px;font-weight:900;line-height:1.15;margin-top:4px}
.hero p{color:var(--muted);margin:8px 0 0}
.who{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;display:grid;gap:10px}
.who label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
.who input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row3{display:grid;grid-template-columns:4.2em 5em 1fr;gap:10px}
.row3>div{min-width:0}
.whynote{font-size:12px;color:var(--muted)}
.lessons{display:grid;gap:12px}
.lcard{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;width:100%}
.lcard .no{grid-row:span 2;width:52px;height:52px;border-radius:14px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;line-height:1}
.lcard .no small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em}
.lcard .t{font-weight:700;font-size:17px}
.lcard .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.track{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.track span{display:block;height:100%;background:var(--teal)}
.pill{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.soon{opacity:.55;cursor:default}
.note{font-size:13px;color:var(--muted);margin-top:18px}

/* lesson */
.goal{background:var(--teal-soft);border:1px solid var(--teal);border-radius:12px;padding:10px 12px;font-size:15px}
.goal b{color:var(--teal)}
.sec{margin-top:22px}
.sh{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--teal);padding-bottom:4px;margin-bottom:10px}
.tag{color:#fff;font-weight:700;font-size:13px;border-radius:99px;padding:1px 10px;white-space:nowrap}
.sh h2{font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card.info{border-color:var(--teal)}
.card.info .k{font-weight:700;color:var(--teal);font-size:13px;display:block}
.q{font-weight:700;margin-bottom:8px}
.q .n{display:inline-block;min-width:1.6em;color:var(--teal)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;min-width:56px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:17px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--orange);background:var(--orange-soft)}
.opt:disabled{cursor:default}
.go{margin-top:10px;min-height:44px;padding:8px 20px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
.go.sub{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.go:disabled{opacity:.4;cursor:default}
.fb{min-height:1.2em;margin-top:8px;font-size:15px}
.fb.ok{color:var(--ok);font-weight:700}
.fb.ng{color:var(--orange);font-weight:700}
.fb .hint{display:block;font-weight:400;color:var(--muted)}
.cls{display:grid;gap:8px}
.cls .r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.cls .r:last-child{border-bottom:none}
.cls .opts{flex-wrap:nowrap}
.cls .opt{font-size:13px;min-width:0;padding:6px 8px}
.cls .mk{font-weight:900;width:1.2em;text-align:center}
.gridbox{margin:6px 0}
.gridbox svg{width:100%;height:auto;display:block;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.task{font-size:15px;margin:6px 0;padding:6px 10px;border-radius:10px;background:var(--orange-soft)}
.task.done{background:var(--ok-soft);color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:none;background:var(--bg);min-height:44px;min-width:52px;cursor:pointer}
.seg button.on{background:var(--teal);color:#fff;font-weight:700}
.num{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.num button{border:none;background:var(--bg);width:44px;height:44px;font-size:22px;cursor:pointer}
.num output{min-width:2.2em;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.num button.b5{width:40px;font-size:15px;font-weight:700;color:var(--muted)}
.step .u{font-size:17px;white-space:nowrap}
.grp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.num.sm button{width:38px}
.num.sm output{min-width:1.9em;font-size:19px}
textarea{width:100%;min-height:76px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.fig{text-align:center;margin:6px 0}
.fig svg{max-width:100%;height:auto}
.rate{display:flex;gap:10px}
.rate .opt{font-size:22px;min-width:64px}
.send{background:var(--surface);border:2px solid var(--teal);border-radius:16px;padding:14px;margin-top:22px}
.send .sum{font-size:15px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.send a.go{display:inline-block;text-decoration:none;text-align:center}
.send small{display:block;color:var(--muted);margin-top:8px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ===== 設定：先生の Apps Script の URL をここに入れると「先生に送る」ボタンが出ます ===== */
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbwDTyhDfzwPdgLKSRrSBRuZXui0WldtB4BBeJqaaH73M2uCij-evtuSHmSIKgKf24z-/exec";  /* 例: "https://script.google.com/macros/s/XXXX/exec" */
const APP_VER = "2";

/* ---------- storage (per device) ---------- */
const KEY = "vecwork.v1";
let S = {name:"", num:"", cls:"", lessons:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function L(id){ return S.lessons[id] || (S.lessons[id] = {items:{}, texts:{}, rate:"", sent:false, sentAt:"", active:0, last:0}); }
/* 取り組み時間：操作と操作の間を最大2分まで足していく */
function touch(){ if(!cur) return; const st=L(cur.id), now=Date.now(); if(st.last) st.active=(st.active||0)+Math.min(now-st.last,120000); st.last=now; save(); }

/* ---------- notation helpers ---------- */
const v = s => s==="0" ? '<span class="v z">0</span>' : '<span class="v">'+s+'</span>';
const m = s => '<span class="m">'+s+'</span>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- SVG helpers (units: grid cells, y up) ---------- */
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function arrowSvg(x1,y1,x2,y2,color,w,head){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy); if(!L) return "";
  const ux=dx/L, uy=dy/L, bx=x2-ux*head, by=y2-uy*head, px=-uy, py=ux, hw=head*0.45;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`+
         `<polygon points="${x2},${y2} ${bx+px*hw},${by+py*hw} ${bx-px*hw},${by-py*hw}" fill="${color}"/>`;
}
function vecLabel(x,y,name,color,size){
  const w=size*0.55*name.length;
  return `<text x="${x}" y="${y+size*0.35}" font-family="STIX Two Text,serif" font-style="italic" font-size="${size}" fill="${color}" text-anchor="middle">${name}</text>`+
         arrowSvg(x-w/2-size*.05, y-size*0.6, x+w/2+size*.15, y-size*0.6, color, size*0.07, size*0.22);
}
function ptLabel(x,y,name,color,size){
  return `<text x="${x}" y="${y}" font-family="STIX Two Text,serif" font-style="italic" font-size="${size}" fill="${color}" text-anchor="middle">${name}</text>`;
}

/* ---------- lesson data ---------- */
const fig = {};
fig.anat = () => { const c=css('--ink'), t=css('--teal');
  return `<svg viewBox="0 0 64 26" width="300">${arrowSvg(6,16,56,6,t,.8,3.2)}<circle cx="6" cy="16" r="1.1" fill="${c}"/>${ptLabel(3,21,'A',c,4.6)}${ptLabel(59,8,'B',c,4.6)}<text x="11" y="24.5" font-size="3.2" fill="${t}" text-anchor="middle">始点</text><text x="52" y="14" font-size="3.2" fill="${t}" text-anchor="middle">終点</text></svg>`; };
fig.cdef = () => { const c=css('--ink'), t=css('--teal');
  return `<svg viewBox="0 0 92 26" width="340">${arrowSvg(8,16,40,5,t,.8,3)}${ptLabel(5,20,'C',c,4.4)}${ptLabel(44,7,'D',c,4.4)}${arrowSvg(84,5,54,17,t,.8,3)}${ptLabel(87,7,'E',c,4.4)}${ptLabel(51,22,'F',c,4.4)}<text x="24" y="25" font-size="3.4" fill="${c}" text-anchor="middle">①</text><text x="70" y="25" font-size="3.4" fill="${c}" text-anchor="middle">②</text></svg>`; };
fig.para = () => { const c=css('--ink'); const P=[[10,26],[52,26],[68,6],[26,6]], n='ABCD', d=[[-3,4],[2,4],[3,-1],[-3,-1]];
  return `<svg viewBox="0 0 80 32" width="300"><polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width=".6"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r=".9" fill="${c}"/>`+ptLabel(p[0]+d[i][0],p[1]+d[i][1],n[i],c,4.4)).join('')}</svg>`; };
fig.pass = () => { const c=css('--ink'), t=css('--teal'), o=css('--orange');
  return `<svg viewBox="0 0 88 32" width="330">${arrowSvg(8,24,48,10,t,.8,3)}${arrowSvg(48,10,80,22,t,.8,3)}<line x1="8" y1="24" x2="77" y2="22.1" stroke="${o}" stroke-width=".7" stroke-dasharray="2,1.2"/>${[[8,24,'A',-3,3],[48,10,'B',0,-2.5],[80,22,'C',3.5,2]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1" fill="${c}"/>`+ptLabel(p[0]+p[3],p[1]+p[4],p[2],c,4.4)).join('')}<text x="24" y="13" font-size="3.3" fill="${t}" text-anchor="middle">パス</text><text x="70" y="13" font-size="3.3" fill="${t}" text-anchor="middle">ドリブル</text></svg>`; };
fig.sumrule = () => { const t=css('--teal'), o=css('--orange');
  return `<svg viewBox="0 0 60 32" width="240">${arrowSvg(6,26,36,20,t,.7,2.6)}${arrowSvg(36,20,52,6,t,.7,2.6)}${arrowSvg(6,26,52,6,o,.7,2.6)}${vecLabel(21,30,'a',t,4)}${vecLabel(49,15,'b',t,4)}<text x="23" y="12" font-size="3.4" fill="${o}">合わせた矢印</text></svg>`; };
fig.tri = () => { const t=css('--teal'), o=css('--orange'), c=css('--ink');
  return `<svg viewBox="0 0 70 44" width="250">${arrowSvg(6,36,42,36,t,.7,2.6)}${arrowSvg(42,36,42,6,t,.7,2.6)}${arrowSvg(6,36,42,6,o,.7,2.6)}${vecLabel(24,42,'a',t,4)}${vecLabel(48,22,'b',t,4)}<text x="58" y="27" font-size="3.2" fill="${c}" text-anchor="middle">大きさ4</text><text x="30" y="31" font-size="3.2" fill="${c}" text-anchor="middle">大きさ3</text></svg>`; };

function arcSvg(cx,cy,r,a1,a2,col,w){ const f=a=>[cx+r*Math.cos(a*Math.PI/180), cy-r*Math.sin(a*Math.PI/180)]; const [x1,y1]=f(a1),[x2,y2]=f(a2); const large=((a2-a1)%360+360)%360>180?1:0; return `<path d="M${x1},${y1} A${r},${r} 0 ${large} 0 ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${w}"/>`; }
const jt = (x,y,s,sz,col,a) => `<text x="${x}" y="${y}" font-size="${sz}" fill="${col}" text-anchor="${a||'middle'}">${s}</text>`;
fig.mult = () => { const t=css('--teal'), o=css('--orange');
  const tx=(x,y,s,col)=>`<text x="${x}" y="${y}" font-family="STIX Two Text,serif" font-size="3.8" fill="${col}" text-anchor="middle">${s}</text>`;
  return `<svg viewBox="0 0 106 14" width="360">${arrowSvg(4,10,20,10,t,.6,2.2)}${vecLabel(12,5,'a',t,3.8)}${arrowSvg(28,10,60,10,t,.6,2.2)}${tx(43,6.2,'2',t)}${vecLabel(47,5,'a',t,3.8)}${arrowSvg(84,10,68,10,o,.6,2.2)}${tx(72,6.2,'−',o)}${vecLabel(76,5,'a',o,3.8)}${arrowSvg(92,10,100,10,t,.6,1.8)}${tx(94,6.2,'½',t)}${vecLabel(98,5,'a',t,3.8)}</svg>`; };
fig.hex = () => { const c=css('--ink'), t=css('--teal'), o=css('--orange'), mu=css('--muted');
  const R=22,cx=36,cy=30, ang={A:240,B:300,C:0,D:60,E:120,F:180}; const P={};
  for(const k in ang){ const a=ang[k]*Math.PI/180; P[k]=[cx+R*Math.cos(a), cy-R*Math.sin(a)]; }
  const ord="ABCDEF".split("");
  let s=`<polygon points="${ord.map(k=>P[k].join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width=".5"/>`;
  [["A","D"],["B","E"],["C","F"]].forEach(([u,w])=>s+=`<line x1="${P[u][0]}" y1="${P[u][1]}" x2="${P[w][0]}" y2="${P[w][1]}" stroke="${mu}" stroke-width=".3"/>`);
  const off={A:[-3,4],B:[3,4],C:[4,1.5],D:[3,-1.5],E:[-3,-1.5],F:[-4.5,1.5]};
  ord.forEach(k=>s+=`<circle cx="${P[k][0]}" cy="${P[k][1]}" r=".8" fill="${c}"/>`+ptLabel(P[k][0]+off[k][0],P[k][1]+off[k][1],k,c,4.2));
  s+=`<circle cx="${cx}" cy="${cy}" r=".8" fill="${c}"/>`+ptLabel(cx+1,cy+5,'O',c,4);
  s+=arrowSvg(P.A[0],P.A[1],P.B[0],P.B[1],t,.75,2.6)+arrowSvg(P.A[0],P.A[1],P.F[0],P.F[1],o,.75,2.6);
  s+=vecLabel((P.A[0]+P.B[0])/2,P.A[1]+6,'a',t,4.2)+vecLabel((P.A[0]+P.F[0])/2-4.5,(P.A[1]+P.F[1])/2+2,'b',o,4.2);
  return `<svg viewBox="0 0 72 58" width="270">${s}</svg>`; };
fig.tire = () => { const c=css('--ink'), t=css('--teal'), o=css('--orange'), mu=css('--muted');
  let s=`<circle cx="12" cy="24" r="7" fill="none" stroke="${c}" stroke-width=".8"/><circle cx="12" cy="24" r="3.4" fill="none" stroke="${c}" stroke-width=".4"/>`;
  s+=arrowSvg(19,21,62,3,o,.7,2.6)+`<line x1="19" y1="30" x2="68" y2="30" stroke="${t}" stroke-width=".6" stroke-dasharray="2,1"/>`+arrowSvg(60,30,72,30,t,.6,2.4);
  s+=`<line x1="62" y1="3" x2="62" y2="21" stroke="${mu}" stroke-width=".35" stroke-dasharray="1,.8"/><line x1="19" y1="21" x2="62" y2="21" stroke="${o}" stroke-width="1.4"/>`;
  s+=jt(44,8,'引く力',3.2,o)+jt(64,35,'進む向き',3.2,t)+jt(40,26,'役に立つ分（影）',3,o)+arcSvg(19,21,7,0,22.7,c,.3)+jt(29,19.5,'θ',3.4,c);
  return `<svg viewBox="0 0 80 38" width="320">${s}</svg>`; };
fig.ang = th => { const t=css('--teal'), o=css('--orange'), c=css('--ink'), mu=css('--muted');
  const W=50; let ox = th>90?16:6; const oy=22; if(th>=150) ox=22; const la=26, lb=18;
  const ax=ox+la, bx=ox+lb*Math.cos(th*Math.PI/180), by=oy-lb*Math.sin(th*Math.PI/180);
  const oy2 = th===0 ? oy-1.6 : oy;
  let s=`<line x1="2" y1="${oy}" x2="${W-2}" y2="${oy}" stroke="${mu}" stroke-width=".25" stroke-dasharray="1,1"/>`;
  s+=arrowSvg(ox,oy,ax,oy,t,.6,2.2)+arrowSvg(ox,oy2,bx,by+(oy2-oy),o,.6,2.2);
  if(th>0&&th<180&&th!==90) s+=`<line x1="${bx}" y1="${by}" x2="${bx}" y2="${oy}" stroke="${mu}" stroke-width=".3" stroke-dasharray="1,.8"/>`;
  if(th!==0&&th!==180) s+=arcSvg(ox,oy,4.5,0,th,c,.3);
  s+=vecLabel(ox+la-3,oy+5,'a',t,4.2);
  let lx=bx+(th<=90?3:-3), ly=th!==0&&th!==180?by-1:by-3.5;

{ id:"L6", no:6, title:"成分で表す", sub:"「右へ3，上へ2」を (3, 2) と書く",

  secs:[

{ id:"L8", no:8, title:"内積（1）", sub:"「影」でとらえるベクトルのかけ算",

    CH("角が 90° より<b>大きい</b>と，内積は？", ["正","0","負"], 2)

  ]},

/* assign stable ids and count judged units */
LESSONS.forEach(les => { let k=0; les.secs.forEach(sec => sec.items.forEach(it => {
  it.id = les.id + "-" + (k++);
  it.units = it.t==="cls" ? it.rows.length : it.t==="draw" ? (it.tasks||[]).length :
             ["choice","multi","num","read","comp"].includes(it.t) ? 1 : 0;
})); les.total = les.secs.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.units,0),0); });

function unitKeys(it){
  if(it.t==="cls") return it.rows.map((_,i)=>it.id+"."+i);
  if(it.t==="draw") return (it.tasks||[]).map((_,i)=>it.id+"."+i);
  return it.units ? [it.id] : [];
}
function stats(les){
  const st=L(les.id); let done=0, first=0, shown=0, tries=0;
  les.secs.forEach(s=>s.items.forEach(it=>unitKeys(it).forEach(k=>{ const r=st.items[k]; if(r){ tries+=r.tries||0; if(r.ok){done++; if(r.first) first++; if(r.shown) shown++;} } })));
  return {done, first, shown, tries, total:les.total, minutes:Math.round((st.active||0)/60000)};
}
function mark(key, ok){
  const st=L(cur.id); const r=st.items[key] || (st.items[key]={ok:false, tries:0, first:false});
  if(r.ok) return r;
  r.tries++; if(ok){ r.ok=true; r.first = r.tries===1; }
  touch(); updateScore(); return r;
}

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function fbSet(fb, ok, msg, hint){ fb.className="fb "+(ok?"ok":"ng"); fb.innerHTML = msg + (hint?`<span class="hint">ヒント：${hint}</span>`:""); }

function renderItem(it){
  const st=L(cur.id);
  if(it.t==="text") return el("p",null,it.html);
  if(it.t==="info") return el("div","card info",`<span class="k">${it.k}</span>${it.html}`);
  if(it.t==="fig") return el("div","fig",fig[it.name](it.arg));

  const card=el("div","card");
  if(it.t==="choice"||it.t==="multi"){
    card.appendChild(el("div","q",it.q));
    const ops=el("div","opts"); const fb=el("div","fb");
    const r=st.items[it.id]; const picked=new Set();
    it.opts.forEach((o,i)=>{
      const b=el("button","opt",o); b.type="button";
      if(r&&r.ok){ const right = it.t==="multi" ? it.ans.includes(i) : i===it.ans; if(right) b.classList.add("right"); b.disabled=true; }
      b.addEventListener("click",()=>{
        if(it.t==="choice"){
          const ok=i===it.ans; const rr=mark(it.id, ok);
          ops.querySelectorAll(".opt").forEach(x=>x.classList.remove("wrong"));
          if(ok){ b.classList.add("right"); ops.querySelectorAll(".opt").forEach(x=>x.disabled=true); fbSet(fb,true,"○ せいかい！"); }
          else { b.classList.add("wrong"); fbSet(fb,false,"もう一度", rr.tries>=1?it.hint:null); }
        } else { if(picked.has(i)){picked.delete(i); b.classList.remove("sel");} else {picked.add(i); b.classList.add("sel");} }
      });
      ops.appendChild(b);
    });
    card.appendChild(ops);
    if(it.t==="multi" && !(r&&r.ok)){
      const go=el("button","go","こたえる"); go.type="button";
      go.addEventListener("click",()=>{
        const ok = picked.size===it.ans.length && it.ans.every(a=>picked.has(a));
        const rr=mark(it.id, ok);
        if(ok){ ops.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true; x.classList.remove("sel"); if(it.ans.includes(i)) x.classList.add("right");}); go.remove(); fbSet(fb,true,"○ せいかい！"); }
        else fbSet(fb,false,"もう一度", it.hint);
      });
      card.appendChild(go);
    }
    if(r&&r.ok) fbSet(fb,true,"○ せいかい！");
    card.appendChild(fb); return card;
  }
  if(it.t==="num"){
    card.appendChild(el("div","q",it.q));
    const r=st.items[it.id]; let val = r&&r.ok ? it.ans : 0;
    const row=el("div","step"); const n=numCtl(()=>val,x=>{val=x;},true);
    const btns=n.querySelectorAll("button");
    const go=el("button","go","こたえる"); go.type="button"; const fb=el("div","fb");
    go.addEventListener("click",()=>{ const ok=val===it.ans; mark(it.id,ok);
      if(ok){ fbSet(fb,true,"○ せいかい！"); go.disabled=true; btns.forEach(b=>b.disabled=true); } else fbSet(fb,false,"もう一度", it.hint); });
    if(r&&r.ok){ go.disabled=true; btns.forEach(b=>b.disabled=true); fbSet(fb,true,"○ せいかい！"); }
    row.append(n,go); card.append(row,fb); return card;
  }
  if(it.t==="comp") return renderComp(it, card);
  if(it.t==="free"){
    card.appendChild(el("div","q",it.q));
    const ta=el("textarea"); ta.id="ta-"+it.id; ta.value=st.texts[it.id]||""; ta.addEventListener("input",()=>{ st.texts[it.id]=ta.value; touch(); });
    card.appendChild(ta); return card;
  }
  if(it.t==="cls"){
    card.appendChild(el("div","q",it.q));
    const wrap=el("div","cls");
    it.rows.forEach((row,ri)=>{
      const key=it.id+"."+ri; const r=st.items[key];
      const line=el("div","r"); const lab=el("div",null,row[0]); const ops=el("div","opts");
      it.opts.forEach((o,oi)=>{ const b=el("button","opt",o); b.type="button";
        if(r&&r.ok){ b.disabled=true; if(oi===row[1]) b.classList.add("right"); }
        b.addEventListener("click",()=>{ const ok=oi===row[1]; mark(key,ok);
          ops.querySelectorAll(".opt").forEach(x=>x.classList.remove("wrong"));
          if(ok){ b.classList.add("right"); ops.querySelectorAll(".opt").forEach(x=>x.disabled=true); }
          else b.classList.add("wrong"); });
        ops.appendChild(b); });
      line.append(lab,ops); wrap.appendChild(line);
    });
    card.appendChild(wrap); return card;
  }
  if(it.t==="read") return renderRead(it, card);
  if(it.t==="draw") return renderDraw(it, card);
  return card;
}

/* ---------- grid ---------- */
function gridSvg(w,h,inner,ax){
  const pad=.7, g=css('--grid'); let s="";
  for(let x=0;x<=w;x++) s+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${g}" stroke-width=".04"/>`;
  for(let y=0;y<=h;y++) s+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${g}" stroke-width=".04"/>`;
  if(ax){ const ink=css('--ink'), mu=css('--muted'), ox=ax[0], oy=ax[1], yy=h-oy;
    s+=`<line x1="0" y1="${yy}" x2="${w}" y2="${yy}" stroke="${ink}" stroke-width=".07"/><line x1="${ox}" y1="0" x2="${ox}" y2="${h}" stroke="${ink}" stroke-width=".07"/>`;
    const tx=(x,y,t,a,sz,c)=>`<text x="${x}" y="${y}" font-family="STIX Two Text,serif" font-size="${sz}" fill="${c}" text-anchor="${a}">${t}</text>`;
    for(let i=0;i<=w;i++){ if(i!==ox) s+=tx(i,yy+.5,String(i-ox).replace("-","−"),"middle",.36,mu); }
    for(let j=0;j<=h;j++){ if(j!==oy) s+=tx(ox-.12,h-j+.13,String(j-oy).replace("-","−"),"end",.36,mu); }
    s+=tx(ox-.15,yy+.5,"O","end",.5,ink)+tx(w+.15,yy-.12,"x","start",.5,ink)+tx(ox+.12,-.1,"y","start",.5,ink); }
  return `<svg viewBox="${-pad} ${-pad} ${w+2*pad} ${h+2*pad}" role="img" style="max-width:${Math.round((w+1.4)*54)}px">${s}<g class="inner">${inner}</g></svg>`;
}
/* grid coords (y up) -> svg coords */
const X = x => x, Y = (h,y) => h-y;

function arrowAt(h, x,y,dx,dy,color,label,side){
  const x1=X(x), y1=Y(h,y), x2=X(x+dx), y2=Y(h,y+dy);
  let s=arrowSvg(x1,y1,x2,y2,color,.09,.36);
  if(label){ const L=Math.hypot(dx,dy); const nx=-dy/L, ny=-dx/L; const off=.55*(side||1);
    const lx=(x1+x2)/2+nx*off, ly=(y1+y2)/2+ny*off;
    s+= /^[A-Za-z]{1,2}$/.test(label) ? vecLabel(lx,ly,label,color,.62) : `<text x="${lx}" y="${ly+.2}" font-family="STIX Two Text,serif" font-style="italic" font-size=".55" fill="${color}" text-anchor="middle">${label.replace("+"," + ").replace("−"," −")}</text>`; }
  return s;
}
function pointAt(h,x,y,name,color,d){
  d=d||[-.38,.62];
  return `<circle cx="${X(x)}" cy="${Y(h,y)}" r=".13" fill="${color}"/>`+(name?ptLabel(X(x)+d[0],Y(h,y)+d[1],name,color,.62):"");
}

function numCtl(get,set,big,small){
  const bs = big ? [["−5","5へらす",-5,"b5"],["−","1へらす",-1,""],["＋","1ふやす",1,""],["＋5","5ふやす",5,"b5"]] : [["−","1へらす",-1,""],["＋","1ふやす",1,""]];
  const n=el("div","num"+(small?" sm":""));
  const mk=b=>{ const x=el("button",b[3],b[0]); x.type="button"; x.setAttribute("aria-label",b[1]); x.addEventListener("click",()=>{ set(get()+b[2]); out.textContent=String(get()).replace("-","−"); }); return x; };
  const out=el("output",null,String(get()).replace("-","−"));
  bs.slice(0, big?2:1).forEach(b=>n.appendChild(mk(b))); n.appendChild(out); bs.slice(big?2:1).forEach(b=>n.appendChild(mk(b)));
  return n;
}
function renderComp(it, card){
  const st=L(cur.id), r=st.items[it.id];
  card.appendChild(el("div","q",it.q));
  if(it.g){ const g=it.g, t=css('--teal'), c=css('--ink'); let s="";
    (g.arrows||[]).forEach(a=>s+=arrowAt(g.h,a[0],a[1],a[2],a[3],t,a[4]||null));
    (g.points||[]).forEach(p=>s+=pointAt(g.h,p[0],p[1],p[2],c));
    card.appendChild(el("div","gridbox",gridSvg(g.w,g.h,s,g.axes))); }
  const vals = r&&r.ok ? it.ans.slice() : [0,0];
  const row=el("div","step");
  const c0=numCtl(()=>vals[0],x=>{vals[0]=x;},false,true), c1=numCtl(()=>vals[1],x=>{vals[1]=x;},false,true);
  const grp=(...n)=>{ const g=el("span","grp"); g.append(...n); return g; };
  if(it.lab) row.append(grp(el("span","u",it.lab[0]), c0), grp(el("span","u",it.lab[1]), c1));
  else row.append(grp(el("span","up","("), c0, el("span","up",","), c1, el("span","up",")")));
  const go=el("button","go","こたえる"); go.type="button"; const fb=el("div","fb");
  const lock=()=>{ go.disabled=true; row.querySelectorAll("button").forEach(b=>b.disabled=true); };
  go.addEventListener("click",()=>{ const ok = vals[0]===it.ans[0] && vals[1]===it.ans[1]; mark(it.id,ok);
    if(ok){ fbSet(fb,true,"○ せいかい！"); lock(); } else fbSet(fb,false,"もう一度", it.hint); });
  if(r&&r.ok){ lock(); fbSet(fb,true,"○ せいかい！"); }
  card.append(row,go,fb); return card;
}
function renderRead(it, card){
  const st=L(cur.id); const r=st.items[it.id]; const [x,y,dx,dy,name]=it.arrow;
  card.appendChild(el("div","q",`${v(name)} はどれだけ動いている？`));
  const t=css('--teal'), c=css('--ink');
  const gb=el("div","gridbox",gridSvg(it.w,it.h, arrowAt(it.h,x,y,dx,dy,t,name)+pointAt(it.h,x,y,null,c)));
  card.appendChild(gb);
  let hx = r&&r.ok ? (dx<0?"左":"右") : "右", vy = r&&r.ok ? (dy<0?"下":"上") : "上";
  let nx = r&&r.ok ? Math.abs(dx) : 0, ny = r&&r.ok ? Math.abs(dy) : 0;
  function rowUI(a,b,getDir,setDir,getN,setN){
    const row=el("div","step"); const seg=el("div","seg");
    [a,b].forEach(d=>{ const bt=el("button",getDir()===d?"on":"",d); bt.type="button"; bt.addEventListener("click",()=>{ setDir(d); seg.querySelectorAll("button").forEach(z=>z.classList.toggle("on",z.textContent===d)); }); seg.appendChild(bt); });
    const n=el("div","num",`<button type="button" aria-label="1へらす">−</button><output>${getN()}</output><button type="button" aria-label="1ふやす">＋</button>`);
    const o=n.querySelector("output"), [mi,pl]=n.querySelectorAll("button");
    mi.addEventListener("click",()=>{ if(getN()>0){ setN(getN()-1); o.textContent=getN(); } });
    pl.addEventListener("click",()=>{ setN(getN()+1); o.textContent=getN(); });
    row.append(seg, el("span",null,"へ"), n, el("span",null,"マス")); return row;
  }
  const r1=rowUI("右","左",()=>hx,d=>hx=d,()=>nx,n=>nx=n);
  const r2=rowUI("上","下",()=>vy,d=>vy=d,()=>ny,n=>ny=n);
  const go=el("button","go","こたえる"); go.type="button"; const fb=el("div","fb");
  const lock=()=>{ card.querySelectorAll(".step button, .go").forEach(b=>b.disabled=true); };
  go.addEventListener("click",()=>{
    const sx=(hx==="右"?1:-1)*nx, sy=(vy==="上"?1:-1)*ny;
    const ok = sx===dx && sy===dy; const rr=mark(it.id, ok);
    if(ok){ fbSet(fb,true,"○ せいかい！"); lock(); }
    else { let h=null; if(Math.abs(sx)!==Math.abs(dx)||Math.abs(sy)!==Math.abs(dy)) h="始点から終点まで，横と縦のマスを1つずつ数えよう。"; else h="矢じりのある方が終点。向き（右・左，上・下）を見直そう。"; fbSet(fb,false,"もう一度",h); }
  });
  card.append(r1,r2,go,fb);
  if(r&&r.ok){ fbSet(fb,true,"○ せいかい！"); lock(); }
  return card;
}

function renderDraw(it, card){
  const st=L(cur.id); const tasks=it.tasks||[];
  const keys=tasks.map((_,i)=>it.id+"."+i);
  let idx = keys.findIndex(k=>!(st.items[k]&&st.items[k].ok)); if(idx<0) idx=tasks.length;
  let start=null, flash=null; const misses={};
  const list=el("div");
  const gb=el("div","gridbox"); const fb=el("div","fb");
  const tools=el("div","tools");
  function draw(){
    const t=css('--teal'), o=css('--orange'), c=css('--ink'), gv=css('--given');
    let s="";
    (it.given||[]).forEach(a=>s+=arrowAt(it.h,a[0],a[1],a[2],a[3],gv,a[4]));
    tasks.forEach((tk,i)=>{ if(i<idx){ if(tk.pt) s+=pointAt(it.h,tk.pt[0],tk.pt[1],tk.label||null,o,tk.ld); else s+=arrowAt(it.h,tk.s[0],tk.s[1],tk.v[0],tk.v[1],tk.c==='o'?o:t,tk.label||null,-1); } });
    if(flash) s+=arrowAt(it.h,flash[0],flash[1],flash[2],flash[3],o,null);
    (it.points||[]).forEach(p=>s+=pointAt(it.h,p[0],p[1],p[2],c));
    if(start) s+=`<circle class="pulse" cx="${X(start[0])}" cy="${Y(it.h,start[1])}" r=".26" fill="${o}"/>`;
    gb.innerHTML=gridSvg(it.w,it.h,s,it.axes);
    if(!it.view) gb.querySelector("svg").addEventListener("click", onTap);
    list.innerHTML = tasks.map((tk,i)=>`<div class="task ${i<idx?'done':''}">${i<idx?'○ ':(i===idx?'▶ ':'')}${tk.say}</div>`).join("");
    tools.innerHTML="";
    if(idx<tasks.length && (misses[idx]||0)>=2){
      const sh=el("button","go sub","答えを見る"); sh.type="button";
      sh.addEventListener("click",()=>{ const tk=tasks[idx]; const k=keys[idx]; const r=st.items[k]||(st.items[k]={ok:false,tries:0,first:false}); r.tries++; r.ok=true; r.first=false; save(); updateScore();
        r.shown=true; touch();
        fbSet(fb,true,tk.pt?"正しい点はここ。":`こうかく：始点から ${dirText(tk.v)}`); idx++; start=null; draw(); });
      tools.appendChild(sh);
    }
  }
  function onTap(e){
    if(idx>=tasks.length) return;
    const svg=e.currentTarget; const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const gx=Math.round(p.x), gy=Math.round(it.h-p.y);
    if(gx<0||gx>it.w||gy<0||gy>it.h) return;
    const tk0=tasks[idx];
    if(tk0.pt){ const okp = gx===tk0.pt[0] && gy===tk0.pt[1]; mark(keys[idx], okp);
      if(okp){ fbSet(fb,true,"○ せいかい！"); idx++; start=null; flash=null; draw(); return; }
      misses[idx]=(misses[idx]||0)+1; fbSet(fb,false,"もう一度", tk0.hint||"目もりを数えて，その点をタップしよう。"); draw(); return; }
    if(!start){ start=[gx,gy]; flash=null; fb.className="fb"; fb.textContent="次に終点をタップ"; draw(); return; }
    if(start[0]===gx && start[1]===gy){ start=null; fb.textContent="始点を取り消した"; draw(); return; }
    const tk=tasks[idx]; const dv=[gx-start[0], gy-start[1]];
    const okS = start[0]===tk.s[0] && start[1]===tk.s[1], okV = dv[0]===tk.v[0] && dv[1]===tk.v[1];
    const ok = okS && okV; mark(keys[idx], ok);
    if(ok){ fbSet(fb,true,"○ せいかい！"); idx++; start=null; flash=null; draw(); return; }
    misses[idx]=(misses[idx]||0)+1;
    flash=[start[0],start[1],dv[0],dv[1]]; start=null;
    let h = !okS ? "始点（スタートの点）を見直そう。" : "向きか長さがちがう。横と縦のマスを数えよう。";
    fbSet(fb,false,"もう一度",h); draw();
    setTimeout(()=>{ flash=null; draw(); }, 1300);
  }
  function dirText(d){ const a=[]; if(d[0]) a.push((d[0]>0?"右へ":"左へ")+Math.abs(d[0])); if(d[1]) a.push((d[1]>0?"上へ":"下へ")+Math.abs(d[1])); return a.join("，"); }
  if(!it.view) card.appendChild(list);
  card.appendChild(gb);
  if(!it.view){ card.append(fb, tools); }
  draw();
  if(!it.view && idx>=tasks.length) fbSet(fb,true,"○ ぜんぶできた！");
  return card;
}

/* ---------- reflection & send ---------- */
function renderSendSum(){
  const s=stats(cur); const el2=document.getElementById("sendsum");
  const st=L(cur.id);
  el2.innerHTML = `解いた数 <b>${s.done}</b> / ${s.total}　1回目で正解 <b>${s.first}</b>　取り組み時間 <b>${s.minutes}</b>分`+(st.sentAt?`<br><span class="pill">送信済み ${st.sentAt}</span>（何回でも送り直せる）`:"");
}
function renderReflect(){
  const st=L(cur.id);
  const d=el("section","sec");
  d.innerHTML=`<div class="sh"><span class="tag" style="background:var(--t5)">ふりかえり</span><h2>今日の自分をチェック</h2></div>`;
  const c1=el("div","card"); c1.appendChild(el("div","q","今日のゴールは達成できた？"));
  const rate=el("div","rate"); ["◎","○","△"].forEach(x=>{ const b=el("button","opt"+(st.rate===x?" sel":""),x); b.type="button";
    b.addEventListener("click",()=>{ st.rate=x; touch(); rate.querySelectorAll(".opt").forEach(z=>z.classList.toggle("sel",z.textContent===x)); }); rate.appendChild(b); });
  c1.appendChild(rate);
  const mk=(key,q)=>{ const c=el("div","card"); c.appendChild(el("div","q",q)); const ta=el("textarea"); ta.id="ta-"+cur.id+"-"+key; ta.value=st.texts[key]||""; ta.addEventListener("input",()=>{ st.texts[key]=ta.value; touch(); }); c.appendChild(ta); return c; };
  d.append(c1, mk("learned","今日わかったことを一言"), mk("unclear","まだモヤモヤしていること（なければ「なし」）"));
  const sd=el("div","send");
  sd.innerHTML=`<div class="q">先生に送る（成績の記録）</div><div class="sum" id="sendsum"></div>`;
  if(SUBMIT_URL){
    const a=el("a","go","結果を先生に送る"); a.target="_blank"; a.rel="noopener";
    const warn=el("small",null,"");
    const ready=()=>S.name&&S.num;
    const upd=()=>{ if(ready()){ a.href=buildUrl(); a.removeAttribute("aria-disabled"); a.style.opacity=""; warn.textContent="新しいタブで「送信しました」と出たら完了。タブを閉じてここにもどろう。授業の最後に必ず送る。途中で送ってもよい（最後に送ったものが記録になる）。"; }
      else { a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); a.style.opacity=".4"; warn.textContent="もくじにもどって，組・番号・名前を入れてから送ろう。"; } };
    a.addEventListener("pointerdown",upd); a.addEventListener("focus",upd);
    a.addEventListener("click",()=>{ upd(); if(!ready()) return; const d=new Date(); st.sent=true; st.sentAt=(d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); save(); setTimeout(renderSendSum,50); });
    upd(); sd.append(a, warn);
  } else {
    sd.appendChild(el("small",null,"送信先がまだ設定されていません。先生の指示を待とう。"));
  }
  d.appendChild(sd);
  setTimeout(renderSendSum,0);
  return d;
}
function buildUrl(){
  const st=L(cur.id), s=stats(cur);
  const texts=[]; cur.secs.forEach(sec=>sec.items.forEach(it=>{ if(it.t==="free"&&st.texts[it.id]) texts.push(st.texts[it.id]); }));
  const p={lesson:cur.no, cls:S.cls, num:S.num, name:S.name, done:s.done, first:s.first, total:s.total, shown:s.shown, tries:s.tries, minutes:s.minutes, rate:st.rate,
           learned:st.texts.learned||"", unclear:st.texts.unclear||"", texts:texts.join(" / "), ver:APP_VER};
  return SUBMIT_URL + "?" + Object.entries(p).map(([k,x])=>k+"="+encodeURIComponent(String(x).slice(0,500))).join("&");
}

try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(cur) open(cur.id); }); }catch(e){}
home();
